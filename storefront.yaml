openapi: 3.1.0

info:
  title: New Commerce Storefront API
  version: 0.5.0
  description: |
    The API a shop's own website is built on (`/v1/storefront`, `04-api-spec.md` §11). It is a
    separate document from the admin `openapi.yaml`, and the two share nothing by reference: a
    storefront developer reads this file alone, and the API generates the storefront server from
    it into its own package, which never imports the admin one (P1-202).

    **This file grows with the backlog**, as `openapi.yaml` does: a path appears when the item
    that builds it is done (`05-backlog.md`, Phase 3). `P1-213` publishes it at
    `/v1/storefront/openapi.json` with a docs page, and checks that every §11.3 route is here.

    ## Credentials (BR-082)

    Every request carries `X-Api-Key`. Personal data also needs a customer token
    (`Authorization: Bearer`) or, for a guest's order, `X-Order-Token`. A staff token is never
    accepted here (BR-086).

    ## Browser and server (BR-083)

    A request with an `Origin` header must come from the key's `allowed_origin`, else
    `403 origin_not_allowed` with no `Access-Control-Allow-Origin`. Responses echo the matched
    origin (never `*`) and carry `Vary: Origin`. A request with no `Origin` — the website's own
    server — is accepted. A preflight `OPTIONS` needs no key and is answered for any origin.

    ## Conventions

    The admin API's conventions hold here (`04-api-spec.md` §1): money is an integer of minor
    units, times are RFC 3339 in `+07:00`, errors are RFC 9457 `application/problem+json` with
    a `trace_id`, a field the route does not define is `422 unknown_field` — a price field on a
    cart or checkout route above all (BR-089) — and lists are cursor-paginated.

servers:
  - url: https://api.{domain}/v1/storefront
    description: Production. The domain is still undecided — see `05-backlog.md`, `P1-001`.
    variables:
      domain:
        default: example.com
  - url: http://localhost:8080/v1/storefront
    description: Local development.

security:
  - apiKey: []

paths:

  /products:
    get:
      operationId: listProducts
      summary: The shop's visible products
      description: |
        Only visible products (BR-080) that have at least one visible variant, so every row has a
        price. `price_min` and `price_max` are what a shopper pays right now, sales included
        (BR-046). `category` is a category `path` and includes its descendants; `brand` is a
        brand slug; `q` matches the title. `image` is the first image, or `null`.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            examples: ["apparel.tees"]
        - name: brand
          in: query
          required: false
          schema:
            type: string
            examples: ["erigo"]
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: ["-updated_at", "price_min", "-price_min", "title"]
            default: "-updated_at"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /products/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProduct
      summary: One visible product with its visible variants
      description: |
        A draft, archived or unknown slug is `404` (BR-080). `price` is what a shopper pays now;
        show `regular_price` crossed out when `on_sale` (BR-046).
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      operationId: listCategories
      summary: The shop's categories, every tree or one kind
      description: Unpaginated, ordered by `path`. Archived categories are left out.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CategoryKind"
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /brands:
    get:
      operationId: listBrands
      summary: The shop's brands
      description: Unpaginated, ordered by name. Archived brands are left out.
      responses:
        "200":
          description: The brands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandList"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"

  /carts:
    post:
      operationId: createCart
      summary: Start a cart
      description: |
        No body. The `cart_id` is a random UUID and is the cart's only credential: whoever holds
        it can read and change the cart, so the website keeps it as it would a session (BR-087).
        An open cart expires 30 days after its last change.
      responses:
        "201":
          description: The new, empty cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /carts/{cart_id}:
    parameters:
      - $ref: "#/components/parameters/CartId"
    get:
      operationId: getCart
      summary: A cart, priced now
      description: |
        Every item at today's price, sales included; a cart stores no prices (BR-046, BR-087).
        An item whose variant has gone out of view stays listed with `available: false` and no
        price, and `subtotal` leaves it out (BR-090). An unknown, expired or checked-out cart is
        `404`.
      responses:
        "200":
          description: The cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"

  /carts/{cart_id}/items/{variant_id}:
    parameters:
      - $ref: "#/components/parameters/CartId"
      - name: variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setCartItem
      summary: Set a variant's quantity in the cart
      description: |
        Sets the quantity, whether or not the variant is already in the cart; `0` removes it,
        even when the variant is no longer visible. Adding a variant that is not visible is `422`
        on `variant_id` (BR-080). `qty` outside 0–999 is `422`. A price field is
        `422 unknown_field` (BR-089). Moves `expires_at` to 30 days out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemWrite"
      responses:
        "200":
          description: The cart after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /carts/{cart_id}/checkout:
    parameters:
      - $ref: "#/components/parameters/CartId"
    post:
      operationId: checkout
      summary: Turn the cart into an order
      description: |
        Nothing in the request is a price: lines are priced now through `variant_price()`
        (BR-046, BR-089). Checking out the same cart again — a double tap, a retry, twenty at
        once — returns the one order it made with `200` and the same body (BR-088).

        Every item is checked first: any that is no longer available is
        `409 item_unavailable`, naming each in `errors` with its `variant_id`, `sku` and
        `title`, and the cart is left as it was (BR-090). An empty cart is `422 empty_cart`. A
        payment method the shop has not enabled is `422` (BR-122).

        A guest checkout returns `order_token`, the guest's proof the order is theirs; send it
        as `X-Order-Token` to read the order later (BR-091). It is the same on every replay.

        **Until shipping and Midtrans land** (`P1-219`, `P1-220`): there is no
        `shipping_option`, shipping is `0`, and `bank_transfer` is the only method a shop has.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOrder"
        "200":
          description: The order this cart already made (BR-088).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOrder"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /customers:
    post:
      operationId: registerCustomer
      summary: Create a customer account and sign in
      description: |
        Accounts belong to one shop: an email registered here is `422` on `email`, and the same
        email at another shop is unrelated (BR-092). The password is at least 8 characters.
        Answers with tokens: the new customer is signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegister"
      responses:
        "201":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: |
        A wrong password, an unknown email and an account with no password (Google only) are
        the same `401 unauthenticated` (BR-021). Tokens travel in the body, never a cookie
        (BR-093).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/refresh:
    post:
      operationId: refresh
      summary: Swap a refresh token for new tokens
      description: |
        Every refresh rotates: the response has a new `refresh_token`, and the one sent is spent.
        A spent token sent again means it was copied, so the whole session is revoked and the
        answer is `401`; sign the customer in again (BR-093). A session lasts 30 days from its
        last refresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out of one session
      description: Revokes the session `refresh_token` belongs to, if it is the caller's.
      security:
        - apiKey: []
          customerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:

  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        One kind of key, `sf_live_…`, made in the admin (Settings › API keys). Browser requests
        must come from the key's `allowed_origin`; server requests (no `Origin`) are accepted.
        The tenant comes from the key, and nothing in a request can choose another (BR-003,
        BR-028, BR-083). A revoked key stops working within 60 s (BR-085). Missing, unknown or
        revoked is `401 invalid_api_key`.

    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A 15-minute customer access token (`aud = storefront`) from sign-in, sent alongside
        `X-Api-Key`. Its shop must be the key's shop, else `401 customer_auth_required`
        (BR-086, BR-093).

    orderToken:
      type: apiKey
      in: header
      name: X-Order-Token
      description: |
        The guest order token a checkout returns; it opens exactly that one order (BR-091).

  parameters:

    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Pairs with `cursor`; there is no `offset`.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    CartId:
      name: cart_id
      in: path
      required: true
      description: The cart's id, which is also its credential (BR-087).
      schema:
        type: string
        format: uuid

    Cursor:
      name: cursor
      in: query
      required: false
      description: The previous page's `next_cursor`, opaque.
      schema:
        type: string

  schemas:

    Money:
      type: integer
      format: int64
      description: Minor units of IDR, so `19900000` is Rp 199.000 (BR-006).
      examples: [19900000]

    BrandRef:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          examples: ["erigo"]
        name:
          type: string
          examples: ["Erigo"]

    Image:
      type: object
      description: |
        `url` is the 800 px rendition in a list and the 1600 px one on a product, or the original
        until those exist. `sizes` has a URL per width (`1600`, `800`, `200`) once the image
        has been processed, a few seconds after upload; until then it is empty.
      required: [url, sizes]
      properties:
        url:
          type: string
          format: uri
        sizes:
          type: object
          additionalProperties:
            type: string
            format: uri

    ProductListItem:
      type: object
      required: [slug, title, brand, price_min, price_max, image]
      properties:
        slug:
          type: string
        title:
          type: string
        brand:
          oneOf:
            - $ref: "#/components/schemas/BrandRef"
            - type: "null"
        price_min:
          $ref: "#/components/schemas/Money"
        price_max:
          $ref: "#/components/schemas/Money"
        image:
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"

    ProductPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductListItem"
        next_cursor:
          type: [string, "null"]

    ProductImage:
      type: object
      required: [variant_id, url, sizes]
      properties:
        variant_id:
          description: The variant this image shows, or `null` for the whole product.
          type: [string, "null"]
          format: uuid
        url:
          type: string
          format: uri
        sizes:
          type: object
          additionalProperties:
            type: string
            format: uri

    ProductVariant:
      type: object
      required: [id, sku, option_values, price, regular_price, on_sale, weight_grams]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: [string, "null"]
        option_values:
          type: array
          items:
            type: string
          examples: [["Black", "S"]]
        price:
          $ref: "#/components/schemas/Money"
        regular_price:
          $ref: "#/components/schemas/Money"
        on_sale:
          type: boolean
        weight_grams:
          type: integer

    ProductCategory:
      type: object
      required: [kind, name, path]
      properties:
        kind:
          $ref: "#/components/schemas/CategoryKind"
        name:
          type: string
        path:
          type: string

    ProductDetail:
      type: object
      required: [id, slug, title, description, brand, categories, attributes, option_names, images, variants, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        brand:
          oneOf:
            - $ref: "#/components/schemas/BrandRef"
            - type: "null"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ProductCategory"
        attributes:
          type: object
          additionalProperties: true
        option_names:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        updated_at:
          type: string
          format: date-time

    CategoryKind:
      type: string
      enum: [category, series, collection, activity, custom]

    Category:
      type: object
      required: [id, parent_id, kind, name, path]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: [string, "null"]
          format: uuid
        kind:
          $ref: "#/components/schemas/CategoryKind"
        name:
          type: string
        path:
          type: string

    CategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    BrandList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BrandRef"

    CartItem:
      type: object
      required: [variant_id, sku, title, product_slug, option_values, qty, unit_price, line_total, image_url, available]
      properties:
        variant_id:
          type: string
          format: uuid
        sku:
          type: [string, "null"]
        title:
          type: string
          examples: ["Erigo Basic Tee — Black / M"]
        product_slug:
          type: string
        option_values:
          type: array
          items:
            type: string
        qty:
          type: integer
          minimum: 1
          maximum: 999
        unit_price:
          description: Today's price (BR-046); `null` when the item is not available.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        line_total:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        image_url:
          description: The 200 px image of the variant, else of the product; `null` if neither has one.
          type: [string, "null"]
          format: uri
        available:
          description: Whether the variant can still be bought (BR-080, BR-090).
          type: boolean

    Cart:
      type: object
      required: [cart_id, items, item_count, subtotal, expires_at]
      properties:
        cart_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        item_count:
          description: The total quantity of every item.
          type: integer
        subtotal:
          description: Available items only.
          allOf:
            - $ref: "#/components/schemas/Money"
        expires_at:
          type: string
          format: date-time

    CartItemWrite:
      type: object
      required: [qty]
      additionalProperties: false
      properties:
        qty:
          type: integer
          minimum: 0
          maximum: 999

    Contact:
      type: object
      required: [name, email]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: [string, "null"]

    ShippingAddress:
      type: object
      required: [line1, city, province, postal_code]
      additionalProperties: false
      properties:
        line1:
          type: string
          minLength: 1
        line2:
          type: [string, "null"]
        city:
          type: string
          minLength: 1
        province:
          type: string
          minLength: 1
        postal_code:
          type: string
          pattern: "^[0-9]{5}$"

    CheckoutRequest:
      type: object
      required: [contact, shipping_address, payment_method]
      additionalProperties: false
      properties:
        contact:
          $ref: "#/components/schemas/Contact"
        shipping_address:
          $ref: "#/components/schemas/ShippingAddress"
        payment_method:
          type: string
          enum: [bank_transfer, midtrans]
        note:
          type: [string, "null"]

    OrderLine:
      type: object
      required: [sku, title, qty, unit_price]
      properties:
        sku:
          type: [string, "null"]
        title:
          type: string
          examples: ["Erigo Basic Tee — Black / M"]
        qty:
          type: integer
        unit_price:
          $ref: "#/components/schemas/Money"

    Payment:
      type: object
      description: A Midtrans Snap payment link (BR-123).
      required: [snap_token, redirect_url, expires_at]
      properties:
        snap_token:
          type: string
        redirect_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time

    CheckoutOrder:
      type: object
      required: [order_number, status, lines, subtotal, shipping, total, shipping_courier, shipping_service,
                 payment_method, payment, placed_at, order_token]
      properties:
        order_number:
          type: string
          examples: ["ERG-000123"]
        status:
          type: string
          examples: ["pending"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        subtotal:
          $ref: "#/components/schemas/Money"
        shipping:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        shipping_courier:
          type: [string, "null"]
        shipping_service:
          type: [string, "null"]
        payment_method:
          type: string
          enum: [bank_transfer, midtrans]
        payment:
          description: The Midtrans link to pay; `null` for bank transfer.
          oneOf:
            - $ref: "#/components/schemas/Payment"
            - type: "null"
        placed_at:
          type: string
          format: date-time
        order_token:
          description: |
            Guests only, `null` for a signed-in customer. Send it as `X-Order-Token` to read the
            order (BR-091).
          type: [string, "null"]

    CustomerRegister:
      type: object
      required: [email, password, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
        phone:
          type: [string, "null"]

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          examples: ["rt_8d1f…"]

    CustomerProfile:
      type: object
      required: [id, email, name, phone]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: [string, "null"]

    Tokens:
      type: object
      description: |
        `access_token` is a 15-minute JWT to send as `Authorization: Bearer`. `refresh_token` is
        the long-lived credential: keep it out of reach of other scripts, and swap it at
        `/auth/refresh` before the access token runs out (BR-093).
      required: [access_token, expires_in, refresh_token, customer]
      properties:
        access_token:
          type: string
        expires_in:
          description: Seconds until `access_token` expires.
          type: integer
          examples: [900]
        refresh_token:
          type: string
          examples: ["rt_8d1f…"]
        customer:
          $ref: "#/components/schemas/CustomerProfile"

    ErrorCode:
      type: string
      description: |
        The error codes this API returns, a subset of `04-api-spec.md` §1.1. The code is the last
        segment of a `Problem.type` URI.
      enum:
        - validation_failed
        - unknown_field
        - empty_cart
        - unauthenticated
        - invalid_api_key
        - customer_auth_required
        - origin_not_allowed
        - not_found
        - item_unavailable
        - shipping_unavailable
        - rate_limited
        - shipping_rates_unavailable
        - payment_unavailable
        - internal

    ProblemError:
      type: object
      description: |
        One field-level detail inside a `Problem`. An unavailable cart item, for instance, carries
        `variant_id`, `sku` and `title`, so extra properties are permitted by design.
      required: [field]
      properties:
        field:
          type: string
          examples: ["items"]
        detail:
          type: string
      additionalProperties: true

    Problem:
      type: object
      description: |
        RFC 9457 `application/problem+json`. Every error response uses it. `trace_id` is the
        OpenTelemetry trace id; quote it when reporting a problem.
      required: [type, title, status, trace_id]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://docs.example.com/errors/item_unavailable"]
        title:
          type: string
          examples: ["Item unavailable"]
        status:
          type: integer
          examples: [409]
        detail:
          type: string
        instance:
          type: string
        trace_id:
          type: string
          examples: ["4bf92f3577b34da6a3ce929d0e0e4736"]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"

  responses:

    InvalidApiKey:
      description: |
        `invalid_api_key`: `X-Api-Key` is missing, unknown or revoked. `customer_auth_required`:
        a customer or order token is missing, invalid, expired or for another shop.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    OriginNotAllowed:
      description: |
        `origin_not_allowed`: the request's `Origin` is not the key's `allowed_origin`. Sent
        without `Access-Control-Allow-Origin`, so a browser hides it from the page (BR-083).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotFound:
      description: No such resource in this shop.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Conflict:
      description: |
        `item_unavailable`: an item in the cart can no longer be bought; `errors` names each one
        with `variant_id`, `sku` and `title` (BR-090).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    UnprocessableEntity:
      description: |
        Validation failed, or the body has a field the route does not define
        (`unknown_field`, BR-089).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
