openapi: 3.1.0

info:
  title: New Commerce API
  version: 2.4.1
  description: |
    Ecommerce Backoffice v2 — the admin API (`/v1`). The storefront API (`/v1/storefront`) is
    published as its own document, `/v1/storefront/openapi.json`, built by `P1-213`.

    **This file is a skeleton plus the paths already built.** It carries the conventions from
    `04-api-spec.md` §1 that every endpoint depends on — authentication, the error envelope,
    money, pagination, optimistic concurrency, rate limiting — and only the endpoints whose
    backlog item is done: `P1-011` the three auth paths, `P1-012` roles, `P1-021` brands, `P1-024` categories, `P1-028` products, `P1-029` variants, `P1-060` jobs, `P1-040` the variant matrix.

    Every other path is added by the backlog item that builds it (`05-backlog.md`). The API repo
    generates a strict server interface from this file, so a path listed here before its handler
    exists breaks the build.

    That leaves this file **incomplete** relative to `04-api-spec.md`, not in conflict with it.
    For anything both files describe they must agree: change one, change the other, in the same
    commit.

    `/healthz` is deliberately absent and stays that way. A liveness probe is a property of how
    the service is deployed, not of the contract, and putting it here would make every future
    change to it a contract change.

servers:
  - url: https://api.{domain}/v1
    description: |
      Production. The domain is still undecided — see `05-backlog.md`, `P1-001`.
    variables:
      domain:
        default: example.com
  - url: http://localhost:8080/v1
    description: Local development, against the host services from `P1-000`.

# Every admin endpoint requires a staff bearer token unless it opts out with `security: []`.
# The unauthenticated ones are login and refresh; accept-invite joins them when P1-064
# adds it. Storefront security schemes are declared below for the storefront document.
security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      operationId: login
      summary: Exchange an email and password for an access token
      description: |
        The tenant is resolved from the user row -- `email` is unique across the whole system, so
        it identifies exactly one user and therefore exactly one tenant. There is deliberately no
        tenant, workspace or subdomain parameter.

        On success the refresh token is set as an httpOnly, Secure, SameSite=Lax cookie. It is
        never in the response body, where a script could read it.

        A wrong password, an unknown email and a disabled account all return the same `401`. Any
        difference between them tells an attacker which emails exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The refresh token, httpOnly, Secure, SameSite=Lax.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh token and issue a new access token
      description: |
        Reads the refresh token from the cookie, never from the body. Unauthenticated by
        necessity -- this is what you call *because* the access token has expired.

        Each call issues a new refresh token and revokes the one presented. **Presenting a token
        that was already rotated means it was stolen**: the entire rotation chain is revoked and
        every session for that user ends, rather than that one request being rejected.
      security: []
      responses:
        "200":
          description: Rotated.
          headers:
            Set-Cookie:
              description: The new refresh token. The old one is revoked.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh token
      description: |
        Revokes the refresh token in the cookie and clears it. The access token is not revoked --
        it is stateless and expires on its own within 15 minutes.

        Idempotent: logging out twice, or with no cookie at all, is still `204`. There is nothing
        useful to tell a caller about a session that is already gone.
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears the refresh token cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /roles:
    get:
      operationId: listRoles
      summary: The four seeded roles and the permissions each grants
      description: |
        Fixed and identical for every tenant. There are no custom roles and no per-user
        overrides, so this is a constant -- it exists so a client can render a role picker and
        explain what a role means without hardcoding the matrix from `04-api-spec.md` §3.

        Requires `users:read`, because it is part of the team-management surface. An `ops` user
        gets `403` naming that permission (BR-024).
      responses:
        "200":
          description: The seeded roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /brands:
    get:
      operationId: listBrands
      summary: Brands, sorted by name
      description: |
        Cursor-paginated and sorted by `name`. `q` matches the name. Archived brands are listed
        only with `archived=true` (BR-012). Requires `brands:read`.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of brands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      operationId: createBrand
      summary: Create a brand
      description: |
        The slug is derived from the name and is never accepted from a client (BR-008). A name
        whose slug matches another brand's in this tenant, archived ones included, is `422` on
        `name` (BR-030). Requires `brands:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /brands/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getBrand
      summary: One brand
      responses:
        "200":
          description: The brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateBrand
      summary: Rename a brand
      description: |
        The slug is re-derived from the new name. No `If-Match`: brands have no version and the
        last save wins (BR-010). Requires `brands:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandWrite"
      responses:
        "200":
          description: The renamed brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: archiveBrand
      summary: Archive a brand
      description: Sets `archived_at`; the row is kept (BR-012). Requires `brands:write`.
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      operationId: listCategories
      summary: Categories, flat, sorted by kind then path
      description: |
        Unpaginated; the client builds the tree from `parent_id`. `kind` limits to one tree,
        `parent_id` starts below that node, `depth` limits how many levels below it (or below the
        roots) come back. Archived categories are not listed. Requires `categories:read`.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CategoryKind"
        - name: parent_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      operationId: createCategory
      summary: Create a category
      description: |
        `path` is derived from the name and parent and is never accepted (BR-008, BR-032). A
        parent must be a live category of the same kind in this tenant, else `422` on
        `parent_id`. Same-named siblings get distinct labels (BR-035). Requires
        `categories:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCategory
      summary: One category, with the counts the move dialog needs
      description: |
        `descendant_count` is live categories below this one; `product_count` is live products
        linked anywhere in the subtree (BR-033).
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCategory
      summary: Rename or move a category
      description: |
        A rename or move rewrites every descendant's path in one statement and leaves product
        links alone (BR-032, BR-033). Moving beneath itself or a descendant is `422` on
        `parent_id` (BR-034); `parent_id: null` makes it a root. `kind` cannot change. No
        `If-Match`: last save wins (BR-010). Requires `categories:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: The category with its new path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: archiveCategory
      summary: Archive a category
      description: |
        Archives (BR-012). A category with live children or live products in its subtree is
        `409 category_in_use`, with `errors` naming `children` and `products` and their counts
        (BR-036). Requires `categories:write`.
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /products:
    get:
      operationId: listProducts
      summary: Products, filtered and cursor-paginated
      description: |
        `q` is a trigram match on the title, and an exact SKU also matches. `category_id`
        includes its descendants. Archived products appear only with `status=archived`. Each
        row's `categories` are its main-tree ones (`kind = category`), by path; an empty list
        means it cannot be published (BR-038). `price_min` and `price_max` come from
        `variant_price()` over live variants (BR-046), `null` when there are none. Target: p95
        under 600 ms at 10k products (P1-030). Requires `products:read`.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: brand_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: ["-created_at", "-updated_at", "title"]
            default: "-created_at"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      operationId: createProduct
      summary: Create a product
      description: |
        New products are `draft` (BR-037). The slug is derived from the title, with `-2`, `-3`, …
        when another product of this tenant (archived included) holds it; it is editable later
        and never follows the title (BR-042). `brand_id` and `category_ids` must name live rows
        of this tenant. Requires `products:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getProduct
      summary: One product
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      summary: Edit a product
      description: |
        `If-Match` is required (BR-010). `null` clears `description` or `brand_id`;
        `category_ids` and `attributes` replace the whole value. `slug` must be lower-case
        `a-z0-9-` and unique in the tenant. `option_names` changes only through the variant
        matrix and is `422` here. `status: "active"` runs the publish check (`422
        publish_check_failed`, BR-038); `"draft"` unpublishes; archiving is `DELETE`.
        Requires `products:write`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: The product, with its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: archiveProduct
      summary: Archive a product
      description: |
        Sets `status` to `archived` and `archived_at`; orders that reference it are untouched
        (BR-012, BR-045). There is no restore in this version. Requires `products:write`.
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/variants:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listVariants
      summary: A product's variants, in grid order
      description: Unpaginated. Archived variants only with `archived=true`. Requires `variants:read`.
      parameters:
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The variants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createVariant
      summary: Add one variant
      description: |
        `option_values` has one entry per `option_names` entry and is unique among the product's
        live variants (BR-040); it changes only through the matrix. A SKU already used in this
        tenant is `409 duplicate_sku` naming the product that holds it (BR-039). A sale price not
        below the regular price, or a sale that ends before it starts, is `422` (BR-046).
        Requires `variants:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /variants/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateVariant
      summary: Edit one variant
      description: |
        `If-Match` on the variant's version (BR-010). `regular_price`, `sale_price` and the
        schedule are writable; `price` and `on_sale` are read-only, and `"sale_price": null` ends
        the sale (BR-046). `option_values` changes only through the matrix. Requires
        `variants:write`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantUpdate"
      responses:
        "200":
          description: The variant, with its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: archiveVariant
      summary: Archive one variant
      description: Archives (BR-012); orders keep their lines (BR-045). Requires `variants:write`.
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getJob
      summary: A background job's progress and result
      description: |
        Long work answers `202 {job_id}`; this is what the client polls (BR-060). The permission is
        the job's own: `products:write` for `product_import`, `exports:read` for `order_export`,
        `channels:read` for `channel_import`, `media:read` for `image_derivatives`. Every `GET` of
        a finished job signs fresh 15-minute URLs (BR-063); the database stores keys.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/variant-matrix:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: putVariantMatrix
      summary: Save the whole variant grid in one request
      description: |
        `If-Match` is the **product's** version (BR-010). Rows match live variants by
        `option_values`; a row matching only an archived variant restores it; anything else is
        created (BR-041). In a row, an omitted field is left as it is and `null` clears a
        nullable one, as on `PATCH`. `archive_missing: true` archives the live variants not
        sent; changing `option_names` needs it.

        The whole request is `422` before any write when a row does not fit `option_names`,
        two rows share `option_values`, or a Colour axis is not at position 0 (BR-040).
        Otherwise one bad row fails alone and the answer is `200` with that row's error; the
        product's version goes up once. Target: 100 cells in under 2 s (P1-041). Requires
        `variants:write`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantMatrix"
      responses:
        "200":
          description: Per-row results and counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantMatrixResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A 15-minute staff JWT (`aud = admin`) for the Next.js admin. Admin routes accept nothing
        else: API keys and customer tokens are storefront credentials and are rejected here
        (BR-086).

        The tenant is derived from the token and is **never** read from a header, query parameter
        or request body — accepting it from the request would be a trivial cross-tenant
        escalation (BR-003).

    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Storefront only. One kind of key, `sf_live_…`. Browser requests must come from the key's
        `allowed_origin`; server requests (no `Origin`) are accepted. The tenant comes from
        the key (BR-028, BR-083).

    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Storefront only. A 15-minute customer JWT (`aud = storefront`, `tid` must match the API
        key's tenant), sent alongside `X-Api-Key` (BR-086, BR-093).

    orderToken:
      type: apiKey
      in: header
      name: X-Order-Token
      description: |
        Storefront only. The HMAC guest order token returned by checkout; opens exactly one order
        (BR-091).

  parameters:

    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Pairs with `cursor`; there is no `offset` in this API.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from the previous page. Cursor pagination only — a deep `offset` on a large
        table is a sequential scan, so the parameter does not exist.
      schema:
        type: string

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `version` read from the resource. Required on every `PATCH`. The server checks it in
        the `UPDATE … WHERE version = $n` predicate; a stale value is `409 version_conflict`, not
        a silent no-op.

        `version` travels here and never in the request body.
      schema:
        type: integer
        minimum: 1

  headers:

    RateLimit-Limit:
      description: Requests permitted in the current window.
      schema:
        type: integer

    RateLimit-Remaining:
      description: Requests left in the current window.
      schema:
        type: integer

    RateLimit-Reset:
      description: Seconds until the window resets.
      schema:
        type: integer

  schemas:

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          examples: ["ops@erigo.co.id"]
        password:
          type: string
          format: password
          minLength: 8

    Session:
      type: object
      description: |
        Returned by both login and refresh. Carries everything the client needs to render a
        signed-in shell without a second request.

        The refresh token is **not** here -- it is in an httpOnly cookie, out of reach of any
        script on the page.
      required: [access_token, expires_in, user, tenant]
      properties:
        access_token:
          type: string
          description: JWT. Held in memory only, never in localStorage.
        expires_in:
          type: integer
          description: Seconds until the access token expires.
          examples: [900]
        user:
          $ref: "#/components/schemas/SessionUser"
        tenant:
          $ref: "#/components/schemas/SessionTenant"

    SessionUser:
      type: object
      required: [id, name, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, ops, viewer]
        permissions:
          type: array
          description: |
            `resource:action` strings the role grants. The client hides actions it does not find
            here rather than disabling them -- a button that 403s advertises a capability the user
            does not have.
          items:
            type: string
            examples: ["products:read"]

    SessionTenant:
      type: object
      required: [id, name, timezone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          description: IANA name. Display only; the wire is always WIB, `+07:00` (BR-007).
          examples: ["Asia/Jakarta"]

    Role:
      type: object
      description: One of the four seeded roles and everything it grants.
      required: [name, permissions]
      properties:
        name:
          type: string
          enum: [owner, admin, ops, viewer]
        description:
          type: string
          description: One line a client can show next to the role in a picker.
        permissions:
          type: array
          items:
            type: string
            examples: ["products:read"]

    Brand:
      type: object
      required: [id, name, slug, archived_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: Derived from `name`; read-only (BR-030).
          examples: ["erigo"]
        archived_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BrandWrite:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1

    BrandPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Brand"
        next_cursor:
          type: [string, "null"]

    CategoryKind:
      type: string
      enum: [category, series, collection, activity, custom]
      description: Independent trees; a product may sit in several (BR-031).

    Category:
      type: object
      required: [id, kind, name, parent_id, path, archived_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CategoryKind"
        name:
          type: string
        parent_id:
          type: [string, "null"]
          format: uuid
        path:
          type: string
          description: Derived by the database from names and parents; read-only (BR-032).
          examples: ["apparel.outerwear.jackets"]
        archived_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryDetail:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          required: [descendant_count, product_count]
          properties:
            descendant_count:
              type: integer
            product_count:
              type: integer

    CategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CategoryCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        parent_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CategoryKind"

    CategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        parent_id:
          type: [string, "null"]
          format: uuid

    Ref:
      type: object
      description: A reference expanded on read (04-api-spec.md §1).
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CategoryRef:
      type: object
      required: [id, kind, name, path]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CategoryKind"
        name:
          type: string
        path:
          type: string

    ProductStatus:
      type: string
      enum: [draft, active, archived]

    Media:
      type: object
      description: One product image (04-api-spec.md §8). URLs are built on read; the database stores keys (BR-050).
      required: [id, product_id, variant_id, mime_type, bytes, width, height, position, url, derivatives, created_at]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        variant_id:
          type: [string, "null"]
          format: uuid
        mime_type:
          type: string
        bytes:
          type: integer
          format: int64
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        position:
          type: integer
        url:
          type: string
        derivatives:
          type: object
          description: '`{"1600": url, "800": url, "200": url}` once the worker has made them (BR-052); `{}` before.'
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time

    Product:
      type: object
      required: [id, version, title, slug, description, status, brand, categories, attributes,
                 option_names, variant_count, media, archived_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          description: Send it back in `If-Match`; never in a body (BR-010).
        title:
          type: string
        slug:
          type: string
          examples: ["erigo-basic-tee"]
        description:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/ProductStatus"
        brand:
          oneOf:
            - $ref: "#/components/schemas/Ref"
            - type: "null"
        categories:
          type: array
          description: Every category the product sits in, all kinds, by kind then path.
          items:
            $ref: "#/components/schemas/CategoryRef"
        attributes:
          type: object
          additionalProperties: true
        option_names:
          type: array
          items:
            type: string
        variant_count:
          type: integer
          description: Live variants.
        media:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        archived_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        brand_id:
          type: string
          format: uuid
        category_ids:
          type: array
          items:
            type: string
            format: uuid
        attributes:
          type: object
          additionalProperties: true

    ProductUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description:
          type: [string, "null"]
        brand_id:
          type: [string, "null"]
          format: uuid
        category_ids:
          type: array
          items:
            type: string
            format: uuid
        attributes:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [draft, active]

    Variant:
      type: object
      required: [id, product_id, version, option_values, sku, barcode, regular_price, sale_price,
                 sale_starts_at, sale_ends_at, price, on_sale, weight_grams, archived_at,
                 created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        version:
          type: integer
        option_values:
          type: array
          items:
            type: string
        sku:
          type: [string, "null"]
        barcode:
          type: [string, "null"]
        regular_price:
          $ref: "#/components/schemas/Money"
        sale_price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        sale_starts_at:
          type: [string, "null"]
          format: date-time
        sale_ends_at:
          type: [string, "null"]
          format: date-time
        price:
          $ref: "#/components/schemas/Money"
        on_sale:
          type: boolean
          description: Read-only. True while the sale's schedule is running (BR-046).
        weight_grams:
          type: integer
        archived_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VariantList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Variant"

    VariantCreate:
      type: object
      required: [option_values]
      additionalProperties: false
      properties:
        option_values:
          type: array
          items:
            type: string
        sku:
          type: string
        barcode:
          type: string
        regular_price:
          $ref: "#/components/schemas/Money"
        sale_price:
          $ref: "#/components/schemas/Money"
        sale_starts_at:
          type: string
          format: date-time
        sale_ends_at:
          type: string
          format: date-time
        weight_grams:
          type: integer
          minimum: 0

    VariantUpdate:
      type: object
      additionalProperties: false
      properties:
        sku:
          type: [string, "null"]
        barcode:
          type: [string, "null"]
        regular_price:
          $ref: "#/components/schemas/Money"
        sale_price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        sale_starts_at:
          type: [string, "null"]
          format: date-time
        sale_ends_at:
          type: [string, "null"]
          format: date-time
        weight_grams:
          type: integer
          minimum: 0

    CategoryBrief:
      type: object
      required: [id, name, path]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string

    ProductListItem:
      type: object
      required: [id, version, title, slug, status, brand, categories, variant_count, price_min,
                 price_max, cover_url, updated_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        title:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        brand:
          oneOf:
            - $ref: "#/components/schemas/Ref"
            - type: "null"
        categories:
          type: array
          description: Main-tree categories only (`kind = category`), by path.
          items:
            $ref: "#/components/schemas/CategoryBrief"
        variant_count:
          type: integer
        price_min:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        price_max:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        cover_url:
          type: [string, "null"]
          description: The first image's 200 px derivative, once made (BR-052).
        updated_at:
          type: string
          format: date-time

    ProductPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductListItem"
        next_cursor:
          type: [string, "null"]

    JobKind:
      type: string
      enum: [product_import, order_export, channel_import, image_derivatives]

    Job:
      type: object
      required: [id, kind, state, processed, total, failed, created_at, finished_at, result, error]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/JobKind"
        state:
          type: string
          enum: [queued, running, done, failed]
        processed:
          type: integer
        total:
          type: [integer, "null"]
        failed:
          type: integer
        created_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        result:
          type: [object, "null"]
          description: |
            `null` until `done`. Per kind: `product_import` carries `created`, `updated` and
            `error_report_url` (+ `expires_in`), `null` when nothing failed; `order_export` carries
            `download_url`.
          additionalProperties: true
        error:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"

    VariantMatrixRow:
      type: object
      required: [option_values]
      additionalProperties: false
      properties:
        option_values:
          type: array
          items:
            type: string
        sku:
          type: [string, "null"]
        barcode:
          type: [string, "null"]
        regular_price:
          $ref: "#/components/schemas/Money"
        sale_price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        sale_starts_at:
          type: [string, "null"]
          format: date-time
        sale_ends_at:
          type: [string, "null"]
          format: date-time
        weight_grams:
          type: integer
          minimum: 0

    VariantMatrix:
      type: object
      required: [option_names, rows, archive_missing]
      additionalProperties: false
      properties:
        option_names:
          type: array
          description: Ordered axes; Colour at position 0 when present (BR-040).
          items:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/VariantMatrixRow"
        archive_missing:
          type: boolean

    VariantMatrixRowResult:
      type: object
      required: [option_values, status, variant_id]
      properties:
        option_values:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [created, updated, restored, unchanged, error]
        variant_id:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string

    VariantMatrixResult:
      type: object
      required: [product_version, created, updated, restored, unchanged, archived, failed,
                 archived_variant_ids, results]
      properties:
        product_version:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        restored:
          type: integer
        unchanged:
          type: integer
        archived:
          type: integer
        failed:
          type: integer
        archived_variant_ids:
          type: array
          items:
            type: string
            format: uuid
        results:
          type: array
          items:
            $ref: "#/components/schemas/VariantMatrixRowResult"

    Money:
      type: integer
      format: int64
      description: |
        An amount in **minor units**, always IDR: `2000000` is Rp 20.000. A plain integer, never
        a float, a decimal string or an object; there is no currency field because there is only
        one currency (BR-006, BR-029). Clients divide by 100 to display.
      examples: [19900000]

    ErrorCode:
      type: string
      description: |
        The canonical error codes, listed with their status and rule in `04-api-spec.md` §1.1.
        The code also appears as the last segment of a `Problem.type` URI, and directly in
        per-row results where an operation partially succeeds (§7.3, §7.5).
      enum:
        - validation_failed
        - unknown_field
        - publish_check_failed
        - empty_cart
        - unauthenticated
        - invalid_api_key
        - customer_auth_required
        - permission_denied
        - origin_not_allowed
        - not_found
        - version_conflict
        - duplicate_sku
        - category_in_use
        - illegal_transition
        - item_unavailable
        - shipping_unavailable
        - rate_limited
        - channel_unavailable
        - shipping_rates_unavailable
        - payment_unavailable
        - internal

    ProblemError:
      type: object
      description: |
        One field-level detail inside a `Problem`. Carries whatever the specific failure needs —
        a version conflict reports `expected` and `supplied`, a validation failure reports a
        message — so extra properties are permitted by design.
      required: [field]
      properties:
        field:
          type: string
          examples: ["version"]
        detail:
          type: string
      additionalProperties: true

    Problem:
      type: object
      description: |
        RFC 9457 `application/problem+json`. Every error response in this API uses it.

        `trace_id` is the OpenTelemetry trace id — a support ticket quoting it goes straight to
        the span. There is no separate `code` field: the code is the last segment of `type`.
      required: [type, title, status, trace_id]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://docs.example.com/errors/version_conflict"]
        title:
          type: string
          examples: ["Version conflict"]
        status:
          type: integer
          examples: [409]
        detail:
          type: string
          examples: ["Product was modified by another user. Reload and retry."]
        instance:
          type: string
          examples: ["/v1/products/01926f3a-0000-7000-8000-000000000000"]
        trace_id:
          type: string
          examples: ["4bf92f3577b34da6a3ce929d0e0e4736"]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"

  responses:

    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Forbidden:
      description: |
        Authenticated but not permitted. **`detail` names the permission that was required**, so a
        caller can tell "you cannot do this" from "you cannot do this yet, ask for `users:write`".
        A client should not render an action it lacks the permission for at all -- a disabled
        control advertises a capability and generates a support ticket.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotFound:
      description: |
        No such resource **in this tenant**. A row belonging to another tenant is indistinguishable
        from one that does not exist, which is the intended behaviour.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Conflict:
      description: |
        `version_conflict` when `If-Match` is stale, `duplicate_sku` when a SKU is already taken
        within the tenant, `category_in_use` when deleting a category that has children or
        products, or `illegal_transition` when an order status move is not in the allow-list.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    UnprocessableEntity:
      description: |
        Validation failed. Also returned when a client sends a server-managed field (on create or
        update, BR-008), sends `null` on create or on a non-nullable field (BR-009), or sends a
        field the endpoint does not define (`unknown_field`, BR-089). Omitting a field and
        sending `null` are not the same thing.

        `publish_check_failed` is also a `422`, listing every reason a product can't go active.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    TooManyRequests:
      description: Rate limit exceeded. See `Retry-After` and the `RateLimit-*` headers (BR-014).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
